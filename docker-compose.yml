services:
  crm-backend:
    build: ./backend
    container_name: crm-backend
    env_file: ./backend/.env
    volumes:
      - crm-data:/data
    networks:
      - crm-net
    restart: unless-stopped

  crm-web:
    build: ./frontend
    container_name: crm-web
    depends_on:
      - crm-backend
    networks:
      - crm-net
      - ngxmanager_default
    restart: unless-stopped

networks:
  crm-net:
    driver: bridge
  ngxmanager_default:
    external: true

volumes:
  crm-data:
